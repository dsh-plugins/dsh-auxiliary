# The dsh-auxiliary-neo bundle patch: inserts this plugin into the profile entry
# list. Declared by `dsh.bundle.patch` in package.json, so `dsh plugin add`
# reconciles the package into `dsh.profile.bundles` and the profile boot
# applies this layer automatically — no manual cordis.patch.yml edit needed.
#
# The patch applies over an empty entry list (bundle layers compose before the
# profile's own cordis.patch.yml), so it is a bare `insert`. Rows the profile
# layer adds afterwards can still target this entry by its stable id.
- insert:
    # Stable id so later layers can patch/disable this row by id.
    - id: dsh-auxiliary-neo
      name: 'dsh-auxiliary-neo'
      config:
        tool:
          enabled: true
