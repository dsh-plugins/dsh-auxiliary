name: Bug Report - Bug反馈
description: Create a report to help us improve. - 反馈问题，帮助我们改进
title: "[Bug] "
labels:
  - 🐛 Bug

body:
  - type: markdown
    attributes:
      value: |
        Before filling in this `issue`, please make sure that there are no similar or duplicate `issues` that have been opened.
        填写此 `issue` 前，请先确认已经开启的 `issue` 没有类似或重复的 `issue`。

  - type: dropdown
    id: system
    attributes:
      label: OS Version - 操作系统
      options:
        - Windows
        - MacOS
        - Linux
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin Version Details - 插件版本信息
      description: |
        What version of dsh-auxiliary do you use? The version number is listed on the plugin entry or npm, in the format `x.x.x` (release) or `x.x.x-dev.N` (dev build).
        你使用的 dsh-auxiliary 版本是什么？版本号见插件列表或 npm，格式为 `x.x.x`（正式版）或 `x.x.x-dev.N`（开发版）。
      placeholder: e.g. 1.3.3 or 1.3.3-dev.55
    validations:
      required: true

  - type: input
    id: dsh_version
    attributes:
      label: DSH Instance & Profile - DSH 实例与 profile
      description: |
        Which DSH version and profile does the problem involve? (e.g. instance 0.1.1-rc.2, profile web.) If the problem is unrelated to a specific instance, fill in "N/A".
        问题涉及哪个 DSH 版本与 profile？（例如：实例 0.1.1-rc.2、profile web）如果与具体实例无关，请填 “N/A”。
      placeholder: e.g. 0.1.1-rc.2 / web
    validations:
      required: true

  - type: textarea
    id: exist
    attributes:
      label: Existing behavior - 现有行为
      description: |
        Please describe the problem you have encountered carefully. For logs, check the DSH instance's terminal output or the browser console (F12 → Console), and paste the relevant excerpts here.
        请仔细描述你所遇到的问题。日志可查看 DSH 实例的终端输出或浏览器控制台（F12 → Console），并将相关片段粘贴到这里。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: Expected behavior - 预期行为
      description: |
        Please describe in detail the results you wish to achieve.
        请仔细描述你要得到的结果。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce - 复现问题
      description: |
        How do you trigger this bug? Please walk us through it step by step.
        这个bug是怎么触发的？请详细告诉我们是怎样出现这个情况的。
    validations:
      required: false

  - type: checkboxes
    id: know
    attributes:
      label: Checks - 检查项
      options:
        - label: I have searched the [issue tracker](https://github.com/dsh-plugins/dsh-auxiliary/issues) and confirmed that there is no identical issue. 我已经搜索[问题追踪器](https://github.com/dsh-plugins/dsh-auxiliary/issues)并且确认没有相同的 Issue。
          required: true
        - label: I admit that I previously checked all options without thorough verification and directly submitted this Issue, and I agree that it can be closed directly. 我承认此前未充分核实便勾选了所有选项并直接提交此 Issue ，且同意该 Issue 可被直接关闭。
        - label: I confirm that I am currently using the latest release or dev version of dsh-auxiliary. If not, this issue can be closed directly. 我确认当前使用的是 dsh-auxiliary 的最新正式版或开发版，若非如此，此 Issue 可被直接关闭。
          required: true
        - label: I promise to provide a detailed description of the encountered issue, along with relevant logs and screenshots, rather than offering incomplete or vague information. 我承诺将详细描述遇到的问题，并提供相关日志与截图，而非提供不完整或模糊的信息。
          required: true
