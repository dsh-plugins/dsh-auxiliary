name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build package
        run: npm run build
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Inspect npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: "quality"
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
    uses: dsh-plugins/dsh-npm-publish/.github/workflows/npm-publish.yml@main
    with:
      install-command: "npm ci"
      prepare-command: |
        npm run build
        node --test tests/*.test.mjs
        npm pack --dry-run
